<!doctype html>
<html lang="de">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Blaster – Bandenbonus</title>
<link rel="stylesheet" href="../../word-blaster.css?v=word-blaster-bonus-1">
<style>body{margin:12px;background:#fffaf1;font:16px system-ui;color:#34564a}#host{width:400px;max-width:100%}#report{white-space:pre-wrap;min-height:48px}button{min-height:44px}</style>
<button id="run">Banden-Treffer prüfen</button><div id="report">Ein echtes Geschoss trifft nach Wandreflexion. Test speichert keine Namen.</div><div id="host"></div>
<script src="../../data/sets/animals_01.bundle.js"></script>
<script src="../../word-blaster.js?v=word-blaster-bonus-1"></script>
<script>
const host=document.querySelector('#host'), report=document.querySelector('#report');
let session;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){const end=Date.now()+5000;while(!fn()){if(Date.now()>end)throw Error('Timeout');await wait(10)}}
function key(code){host.querySelector('.wb-gesture').dispatchEvent(new KeyboardEvent('keydown',{code,bubbles:true}));window.dispatchEvent(new KeyboardEvent('keyup',{code}));}
document.querySelector('#run').onclick=async()=>{
 session?.destroy();
 try{
  session=LernwortWordBlaster.mount(host,{items:[LERNWORT_BUNDLED_SETS.animals_01.items[0]],mode:'challenge',setId:'qa-bank-only',storage:null,urlFor:p=>'../../'+p});
  await until(()=>!host.querySelector('.wb-continue').hidden);
  const stage=host.querySelector('.wb-stage'), g=LernwortWordBlaster.geometry(stage.clientWidth,stage.clientHeight),
    targetY=(g.targetBounds.top+g.targetBounds.bottom)/2,
    angle=Math.atan2(2*(g.bounds.right-g.origin.x),g.origin.y-targetY);
  if(angle>75*Math.PI/180)throw Error('Testfläche braucht mehr Höhe');
  host.querySelector('.wb-continue').click();
  for(let i=0;i<Math.round(angle/.035);i++)key('ArrowRight');
  key('Space');
  await until(()=>host.querySelector('.wb-count').textContent!=='0 Punkte');
  const score=host.querySelector('.wb-count').textContent;
  if(score!=='15 Punkte')throw Error('Erwartet 15 Punkte, erhalten: '+score);
  if (!new URLSearchParams(location.search).has('live')) host.querySelector('.wb-pause').click();
  report.textContent='PASS Echte Wandreflexion vergibt 15 Punkte. Keine Speicherung.';
 }catch(e){report.textContent='FAIL '+e.message;console.error(e)}
};
</script>
</html>
